apiVersion: apps/v1
kind: Deployment
metadata:
  name: manancial
  namespace: aps
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: manancial }
  template:
    metadata:
      labels: { app: manancial, camada: atendimento }
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [k3d-aps-server-0]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: manancial }
      containers:
        - name: api
          image: aps-manancial:3.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: aps-config }
            - secretRef: { name: aps-segredos }
          env:
            - { name: APS_PORT, value: "8081" }
            - { name: APS_COORDENADOR, value: "http://manancial-estado:8081" }
            - { name: APS_VERSAO, value: "3.0.0" }
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - { name: JAVA_TOOL_OPTIONS, value: "-Xms16m -Xmx64m -Xss256k -XX:ActiveProcessorCount=2" }
          ports:
            - { containerPort: 8081 }
          startupProbe:
            httpGet: { path: /health/live, port: 8081 }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /health/live, port: 8081 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /health/ready, port: 8081 }
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests: { cpu: 100m, memory: 80Mi }
            limits: { cpu: 250m, memory: 160Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: manancial
  namespace: aps
spec:
  selector: { app: manancial }
  ports:
    - { name: http, port: 8081, targetPort: 8081 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: manancial
  namespace: aps
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: manancial }
---
